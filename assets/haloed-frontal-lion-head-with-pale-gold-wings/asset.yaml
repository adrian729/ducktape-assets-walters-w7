# descriptive: find it and understand it
id: haloed-frontal-lion-head-with-pale-gold-wings
title: Winged lion head, symbol of Mark
description: The lion of Mark from the canon table, a frontal tan lion face with a curling orange mane, round eyes and a small muzzle, inside a burnished gold halo with an orange rim and a beaded dark border. Two pale yellow-green wings spread upward to either side with white and green feather strokes. The lower edge is cut straight where the sill of the canon table covered it. The background is transparent.
