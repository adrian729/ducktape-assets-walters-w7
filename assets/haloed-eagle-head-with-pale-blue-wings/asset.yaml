# descriptive: find it and understand it
id: haloed-eagle-head-with-pale-blue-wings
title: Winged eagle head, symbol of John
description: The eagle of John from the canon table, a pale blue-grey eagle head in profile facing left with a hooked beak and a brown breast, inside a burnished gold halo with an orange rim and a beaded dark border. Two pale blue wings with mauve tips spread to either side and droop below the halo. The lower edge is cut straight where the sill of the canon table covered it. The background is transparent.
