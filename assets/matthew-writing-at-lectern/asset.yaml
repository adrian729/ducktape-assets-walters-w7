# descriptive: find it and understand it
id: matthew-writing-at-lectern
title: Evangelist Matthew writing at his lectern
description: The Evangelist Matthew sits on a gold bench with a blue cushion, turned to the right, his head raised and eyes looking up. He wears a pale blue tunic under a mauve-red mantle, holds a pen in his left hand over a gold lectern on a blue-grey stand and raises a pale knife in his right, with a red book with an orange clasp under his arm. His halo is deep blue with a beaded white rim and his hair is red. His bare feet rest on a red footstool. The background is transparent.
