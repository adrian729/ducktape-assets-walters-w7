usage_notes:
  - Fixed picture frame, open at the bottom; scale it as a whole and place content between the columns. On the page it enclosed matthew-writing-at-lectern, with winged-haloed-angel-holding-closed-book above the lintel.
  - The small notch at the apex of the gold band is where the angel's wing overlapped the arch; place the angel there to cover it.
