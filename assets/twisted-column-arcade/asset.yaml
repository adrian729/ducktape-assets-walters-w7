# descriptive: find it and understand it
id: twisted-column-arcade
title: Arcade with twisted columns and scalloped arch
description: The architectural arcade of the Matthew portrait page, emptied of its figure. A red-brown semicircular arch with a white scalloped leaf pattern and a burnished gold inner band rests on a gold lintel painted with a row of small arches; two tall columns spiralled in red-brown and pale blue bands carry green acanthus capitals with orange leaves on blue-grey abaci and stand on orange bases over blue-grey and brown plinths. Open at the bottom. Only the paint is opaque; the inside of the arch and the surround are transparent.
