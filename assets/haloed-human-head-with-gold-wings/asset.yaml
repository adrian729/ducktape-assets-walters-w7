# descriptive: find it and understand it
id: haloed-human-head-with-gold-wings
title: Winged man's head, symbol of Matthew
description: The man of Matthew from the canon table, a rose-pink head turned three-quarter to the right with the eyes looking right, blond hair, and the top of a pink tunic at the neck, inside a burnished gold halo with an orange rim and a beaded dark border. Two gold wings with white feather strokes rise and spread to either side. The lower edge is cut straight where the sill of the canon table covered it. The background is transparent.
