# descriptive: find it and understand it
id: haloed-frontal-ox-head-with-rose-wings
title: Winged ox head, symbol of Luke
description: The ox of Luke from the canon table, a frontal pale yellow ox head with two short gold horns, flared ears, dark brows and a long muzzle, inside a burnished gold halo with an orange rim and a beaded dark border. Two dusty rose-mauve wings spread to either side and droop below the halo. The lower edge is cut straight where the sill of the canon table covered it. The background is transparent.
