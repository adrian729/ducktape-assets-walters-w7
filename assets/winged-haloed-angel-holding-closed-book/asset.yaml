# descriptive: find it and understand it
id: winged-haloed-angel-holding-closed-book
title: Half-length angel holding a closed book
description: A half-length angel, the symbol of Matthew, seen to the waist with the head turned three-quarter to the left and the eyes looking left. Blond hair under a burnished gold halo with an orange rim and beaded border; a green mantle over a pale blue tunic; two long gold wings with mauve-red upper coverts spread to either side. Both hands hold a closed book with a gold cover dotted in red. Cut straight at the waist where the lintel of the arcade covered it; the background is transparent.
